[pytest]
# Scope test discovery to the real test suite. Without this, a bare `pytest`
# run from the repo root also recursively collects workspace/<session_id>/,
# where the agent writes its own (sometimes deliberately broken, mid-run, or
# import-mismatched) test_*.py files - which aborts collection for the whole
# suite with unrelated SyntaxError/ImportError failures.
testpaths = tests
